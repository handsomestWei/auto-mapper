[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "automapper-skill"
version = "0.1.0"
description = "Generate automapper schema/rule XML and JSON samples from API docs"
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
automapper-skill = "tools.cli:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
